<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AUDINEXA">
  <!-- Brand square: deep indigo gradient mirroring the AppShell topbar -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#g)"/>
  <!-- Stylised "A" with the central crossbar drawn as a clean audiology waveform -->
  <g fill="none" stroke="#fff" stroke-width="38" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left & right diagonals of the A -->
    <path d="M120 400 L256 112 L392 400"/>
    <!-- Crossbar as a subtle 'sound wave' - 3 beats -->
    <path d="M188 290 q14 -28 28 0 t28 0 t28 0 t28 0 t28 0"/>
  </g>
</svg>
